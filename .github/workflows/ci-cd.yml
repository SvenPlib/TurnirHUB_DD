name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/turnirHub/package-lock.json
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Lint backend
        working-directory: ./backend
        run: npm run lint
      - name: Install frontend dependencies
        working-directory: ./frontend/turnirHub
        run: npm ci
      - name: Lint frontend
        working-directory: ./frontend/turnirHub
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/turnirHub/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./frontend/turnirHub
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend/turnirHub
        run: npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/turnirHub/dist/
          if-no-files-found: error
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate
      - name: Check backend syntax
        working-directory: ./backend
        run: node --check server.js
      - name: Package backend
        run: |
          tar -czf backend-package.tar.gz \
            -C backend \
            server.js src prisma scripts \
            package.json package-lock.json node_modules
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-package.tar.gz
          if-no-files-found: error

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/turnirHub/package-lock.json
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run backend tests with coverage
        working-directory: ./backend
        run: node --test --experimental-test-coverage > coverage-report.txt
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage-report.txt
          if-no-files-found: error
      - name: Install frontend dependencies
        working-directory: ./frontend/turnirHub
        run: npm ci
      - name: Run frontend tests with coverage
        working-directory: ./frontend/turnirHub
        run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/turnirHub/coverage/
          if-no-files-found: error

  build-vercel:
    name: build-vercel
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull Vercel production settings
        working-directory: ./frontend/turnirHub
        run: npx --yes vercel@66.6.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel production artifact
        working-directory: ./frontend/turnirHub
        run: npx --yes vercel@66.6.0 build --prod --token="$VERCEL_TOKEN"
      - name: Package Vercel artifact
        run: |
          tar -czf vercel-output.tar.gz \
            -C frontend/turnirHub \
            .vercel/output
      - name: Upload Vercel artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: vercel-output.tar.gz
          if-no-files-found: error

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [lint, build, test, build-vercel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: ./artifacts/backend
      - name: Prepare backend Docker context
        run: |
          mkdir -p deploy-context
          tar -xzf artifacts/backend/backend-package.tar.gz \
            -C deploy-context
          cp backend/Dockerfile.deploy deploy-context/Dockerfile
      - name: Set Docker image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push backend image
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          docker build --platform linux/amd64 \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$GITHUB_SHA" \
            ./deploy-context
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::Render deploy hook is not configured yet."
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            --get \
            --data-urlencode "imgURL=$IMAGE_NAME:$GITHUB_SHA" \
            "$RENDER_DEPLOY_HOOK_URL"
      - name: Download Vercel artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: ./artifacts/vercel
      - name: Restore Vercel artifact
        run: |
          tar -xzf artifacts/vercel/vercel-output.tar.gz \
            -C .
      - name: Deploy frontend to Vercel
        run: npx --yes vercel@66.6.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
