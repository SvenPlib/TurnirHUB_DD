name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/turnirHub/package-lock.json
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Lint backend
        working-directory: ./backend
        run: npm run lint
      - name: Install frontend dependencies
        working-directory: ./frontend/turnirHub
        run: npm ci
      - name: Lint frontend
        working-directory: ./frontend/turnirHub
        run: npm run lint
